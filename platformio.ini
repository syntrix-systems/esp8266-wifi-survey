; ESP-01 / ESP-01S WiFi survey firmware
; Needs a 1 MB flash module (ESP-01S, most ESP-01 clones). No filesystem is used,
; settings live in emulated EEPROM, so the whole 1 MB is available for code.

[env:esp01_1m]
platform = espressif8266@^4.2.1
board = esp01_1m
framework = arduino
board_build.ldscript = eagle.flash.1m.ld
board_build.f_cpu = 160000000L
monitor_speed = 115200
upload_speed = 115200
build_flags =
    -DPIO_FRAMEWORK_ARDUINO_LWIP2_LOW_MEMORY
    -DNDEBUG
